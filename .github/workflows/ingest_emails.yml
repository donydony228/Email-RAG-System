name: Daily Email Ingestion

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 2am UTC (10am Taipei)
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_MULTI_ACCOUNT: "true"
      GMAIL_CREDENTIALS_ACCOUNT1_BASE64: ${{ secrets.GMAIL_CREDENTIALS_ACCOUNT1_BASE64 }}
      GMAIL_CREDENTIALS_ACCOUNT2_BASE64: ${{ secrets.GMAIL_CREDENTIALS_ACCOUNT2_BASE64 }}
      GMAIL_CREDENTIALS_ACCOUNT3_BASE64: ${{ secrets.GMAIL_CREDENTIALS_ACCOUNT3_BASE64 }}
      GMAIL_TOKEN_ACCOUNT1_BASE64: ${{ secrets.GMAIL_TOKEN_ACCOUNT1_BASE64 }}
      GMAIL_TOKEN_ACCOUNT2_BASE64: ${{ secrets.GMAIL_TOKEN_ACCOUNT2_BASE64 }}
      GMAIL_TOKEN_ACCOUNT3_BASE64: ${{ secrets.GMAIL_TOKEN_ACCOUNT3_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Initialize Gmail credentials
        run: python init_credentials.py

      - name: Train BM25 model from Pinecone corpus
        run: python scripts/train_bm25.py

      - name: Run email ingestion
        run: python scripts/ingest_emails.py --time-range 1d --max-emails 500
